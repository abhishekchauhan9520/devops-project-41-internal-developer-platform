apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: commerce-platform
  description: Example business system for the internal platform
spec:
  owner: group:platform
  domain: commerce

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-api
  description: Example Python API generated by the platform golden path
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - python
    - kubernetes
spec:
  type: service
  lifecycle: production
  owner: group:platform
  system: commerce-platform
  providesApis:
    - orders-api

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: orders-api
  description: Orders HTTP API
spec:
  type: openapi
  lifecycle: production
  owner: group:platform
  system: commerce-platform
  definition:
    $text: https://raw.githubusercontent.com/example/orders-api/main/openapi.yaml

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: orders-postgres
  description: Example managed PostgreSQL resource
spec:
  type: database
  owner: group:platform
  system: commerce-platform
